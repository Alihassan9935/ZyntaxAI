name: Release


on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes shown in the app's update prompt"
        required: false
        default: ""
      linux:
        description: "Also build Linux (normally built locally)"
        type: boolean
        default: false
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
       
        include: ${{ fromJSON(inputs.linux && '[{"os":"windows-latest","target":"windows-x86_64"},{"os":"macos-latest","target":"darwin-aarch64"},{"os":"macos-13","target":"darwin-x86_64"},{"os":"ubuntu-22.04","target":"linux-x86_64"}]' || '[{"os":"windows-latest","target":"windows-x86_64"},{"os":"macos-latest","target":"darwin-aarch64"},{"os":"macos-13","target":"darwin-x86_64"}]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

   
      - name: Install Linux build dependencies
        if: startsWith(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev patchelf

      - run: pnpm install --frozen-lockfile

      - name: Build and sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm release --notes "${{ inputs.notes }}"

  
      - name: Name the manifest after its platform
        shell: bash
        run: mv dist/release/latest.json dist/release/latest-${{ matrix.target }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: zyntaxai-${{ matrix.target }}
          path: dist/release/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: incoming

      
      - name: Collect the artifacts
        id: collect
        run: |
          mkdir -p out
          find incoming -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
               -o -name '*.tar.gz' -o -name '*.AppImage' \
               -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.sig' -o -name 'latest-*.json' \) \
            -exec cp -n {} out/ \;
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Collected:"
          ls -la out

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.collect.outputs.version }}
          DRAFT: ${{ inputs.draft && '--draft' || '' }}
        run: |
          notes=$(printf '%s\n\n%s\n' \
            "${{ inputs.notes }}" \
            "Built by CI. Download these files, delete this release, then upload them to zsync.eu/zyntaxai/releases/ — see zyntaxai/PUBLISHING.md.")

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* \
              --title "ZyntaxAI ${{ steps.collect.outputs.version }}" \
              --notes "$notes" $DRAFT
          fi

      - name: What to do next
        run: |
          cat <<'EOF'
          Download every asset from the release, then on your own machine:

            node scripts/site-sync.mjs ~/Downloads

          That copies the installers into zyntaxai/releases/<version>/, merges
          each latest-*.json into zyntaxai/latest.json alongside the Linux entry
          you built locally, and regenerates SHA256SUMS. Then upload the
          zyntaxai/ folder — files first, latest.json last.
          EOF
