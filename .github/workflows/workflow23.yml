name: Build Installers

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            artifact-name: macos-arm64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            artifact-name: macos-x64
          - platform: ubuntu-22.04
            args: ''
            artifact-name: linux
          - platform: windows-latest
            args: ''
            artifact-name: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Collect installers (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p dist-installers
          find src-tauri/target/release/bundle -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) \
            -exec cp {} dist-installers/ \;

      - name: Collect installers (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-installers
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -Include "*.msi","*.exe" |
            ForEach-Object { Copy-Item $_.FullName -Destination dist-installers/ }

      - name: Collect installers (macOS arm64)
        if: matrix.platform == 'macos-latest' && matrix.args == '--target aarch64-apple-darwin'
        run: |
          mkdir -p dist-installers
          find src-tauri/target/aarch64-apple-darwin/release/bundle -type f -name "*.dmg" \
            -exec cp {} dist-installers/ \;

      - name: Collect installers (macOS x64)
        if: matrix.platform == 'macos-latest' && matrix.args == '--target x86_64-apple-darwin'
        run: |
          mkdir -p dist-installers
          find src-tauri/target/x86_64-apple-darwin/release/bundle -type f -name "*.dmg" \
            -exec cp {} dist-installers/ \;

      - name: Upload platform installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.artifact-name }}
          path: dist-installers/
          if-no-files-found: error

  collect-releases:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: releases
          merge-multiple: true

      - name: Show collected files
        run: ls -lh releases/

      - name: Upload combined releases artifact
        uses: actions/upload-artifact@v4
        with:
          name: releases
          path: releases/
          if-no-files-found: error
